# Local development databases only — run the API with `pnpm start:dev`.
#   docker compose -f docker-compose.dev.yml up -d

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hesab
      POSTGRES_PASSWORD: hesab-dev-password
      POSTGRES_DB: hesab_kitab
    ports:
      - '5432:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hesab -d hesab_kitab']
      interval: 5s
      timeout: 5s
      retries: 10

  # Throwaway database for e2e tests (pnpm test:e2e). No volume on purpose.
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hesab_test
      POSTGRES_PASSWORD: hesab-test-password
      POSTGRES_DB: hesab_kitab_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hesab_test -d hesab_kitab_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev:
